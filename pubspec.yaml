name: sugarscan
description: "On-device OCR based global blood glucose tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 상태관리 / 라우팅
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0

  # 카메라 / OCR
  camera: ^0.12.0+2
  flutter_onnxruntime: ^1.8.3
  google_mlkit_text_recognition: ^0.17.1
  tflite_flutter: ^0.12.1
  image: ^4.9.2

  # 저장 / 동기화
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1

  # 헬스 연동
  health: ^13.3.2

  # 리포트 / 차트
  fl_chart: ^1.2.0
  pdf: ^3.13.0
  printing: ^5.15.0
  csv: ^8.0.0
  share_plus: ^13.3.0

  # 인증 / 보안 / 기타
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  flutter_secure_storage: ^11.0.0
  permission_handler: ^13.0.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  intl: 0.20.2                        # flutter_localizations가 정확히 이 버전으로 고정
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.0                # 2.15.2+ 는 analyzer/meta가 Flutter 3.44 SDK와 충돌
  drift_dev: ^2.34.0                   # 2.34.1+1 부터 analyzer 13 요구 → flutter_test와 충돌
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/
