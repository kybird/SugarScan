<!doctype html>
<meta charset="utf-8">
<title>팔 비교 — 눈으로 검사한다</title>
<!--
  사람 규칙(2026-09-20): "결과가나오면 앞으로 항상 웹툴에서 눈으로
  검사하게하자".

  왜 필요한가: 같은 날 다섯 팔을 '담음' 열만 보고 기각했다가, 게이트로
  다시 재니 다섯 다 유의하게 이겼다(BAND_EXP_PLAN §22). 실제로 일어난 일은
  **상자가 조여진 것**이었는데 숫자 한 열로는 안 보였다. 두 팔의 상자를
  같은 사진에 겹쳐 그리면 한눈에 보인다.

  이 화면이 지키는 것 셋:
  1. **두 자를 함께 낸다** — 담음과 게이트. 한 열만 보면 같은 실수를 반복한다.
  2. **전체 사진 틀을 고를 수 있다** — 상자 주변만 자르면 어떤 상자든
     한가운데로 보여 "사진 어디냐"에 답을 미리 정해 버린다(Case 9).
  3. **칸 수 오름차순**으로 낸다 — 실패가 몰린 작은 밴드부터 눈에 들어온다.
-->
<style>
  :root { --bg:#111; --fg:#ddd; --line:#333; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.55 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:9; background:#1a1a1a;
           border-bottom:1px solid var(--line); padding:9px 14px;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  select, button { background:#242424; color:var(--fg); border:1px solid #444;
           padding:4px 9px; border-radius:4px; font:inherit; cursor:pointer; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; }
  .legend i { display:inline-block; width:11px; height:11px; margin-right:4px;
              vertical-align:-1px; border-radius:2px; }
  .sum { color:#9ad; font-variant-numeric:tabular-nums; }
  .note { padding:9px 14px; color:#aaa; font-size:12px; background:#151515;
          border-bottom:1px solid var(--line); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
          gap:12px; padding:12px; }
  .card { background:#1a1a1a; border:1px solid #2c2c2c; border-radius:6px;
          padding:8px; }
  .card canvas { width:100%; display:block; background:#000; border-radius:3px; }
  .meta { font-size:11px; color:#999; padding-top:5px; line-height:1.6; }
  .row { display:flex; gap:8px; align-items:baseline; }
  .k { width:62px; flex:none; font-weight:600; }
  .win { color:#4ade80; } .lose { color:#f87171; }
  .cells { color:#fde68a; }
</style>

<header>
  <b>팔 비교</b>
  <label>A <select id="a"></select></label>
  <label>B <select id="b"></select></label>
  <label>보기 <select id="only">
    <option value="gate_diff" selected>게이트가 갈린 장</option>
    <option value="b_better">B 가 이긴 장</option>
    <option value="a_better">A 가 이긴 장</option>
    <option value="both_fail">둘 다 못 담은 장</option>
    <option value="all">전부</option>
  </select></label>
  <label>틀 <select id="frame">
    <option value="crop" selected>상자 주변</option>
    <option value="full">전체 사진</option>
  </select></label>
  <label>표본 <select id="split">
    <option value="dev" selected>개발 586</option>
    <option value="test">봉인 시험 687</option>
  </select></label>
  <button id="go">불러오기</button>
  <div class="legend">
    <span><i style="background:#22c55e"></i>사람 라벨</span>
    <span><i style="background:#ef4444"></i>숫자 칸</span>
    <span><i style="background:#eab308"></i><b>A</b> 배포 상자</span>
    <span><i style="background:#38bdf8"></i><b>B</b> 배포 상자</span>
  </div>
  <span id="sum" class="sum"></span>
</header>
<div class="note">
  판정을 <b>두 자로 함께</b> 낸다 — <b>담음</b>(숫자 칸을 덮었나)과
  <b>게이트</b>(덮었고 면적비 ≤ 2인가). 담음만 보면 큰 상자가 이긴다.
  카드는 <b>칸 수 오름차순</b>이다(작은 밴드가 먼저). 2.5칸 밑이 절벽 구간이다.
</div>
<div id="grid">팔을 고르고 불러오기를 누른다.</div>

<script>
const $ = i => document.getElementById(i);
const COL = {gt:'#22c55e', digit:'#ef4444', a:'#eab308', b:'#38bdf8'};
let ARMS = [];

async function init() {
  const r = await (await fetch('/api/arms')).json();
  ARMS = r.arms || [];
  for (const sel of [$('a'), $('b')]) {
    sel.innerHTML = (sel.id === 'b' ? '<option value="">(없음)</option>' : '')
      + ARMS.map(x => `<option value="${x.arm}@${x.dir}">${x.arm}</option>`).join('');
  }
  const pick = (sel, name) => {
    const o = [...sel.options].find(o => o.value.startsWith(name + '@'));
    if (o) sel.value = o.value;
  };
  pick($('a'), 'atone'); pick($('b'), 'asize512');
}

async function load() {
  $('grid').textContent = '불러오는 중…';
  const q = new URLSearchParams({a: $('a').value, b: $('b').value,
                                only: $('only').value, split: $('split').value});
  const r = await (await fetch('/api/arms?' + q)).json();
  if (r.error) { $('grid').textContent = r.error; return; }
  const s = r.summary;
  $('sum').innerHTML = `${r.shown}/${r.matched}장 표시 · 전체 ${s.n} · `
    + `A 담음 ${s.a_cont}% 게이트 <b>${s.a_gate}%</b>`
    + (s.b_gate !== undefined
       ? ` · B 담음 ${s.b_cont}% 게이트 <b>${s.b_gate}%</b>` : '');
  $('grid').innerHTML = '';
  for (const it of r.items) $('grid').appendChild(card(it));
}

function card(it) {
  const d = document.createElement('div');
  d.className = 'card';
  const cv = document.createElement('canvas');
  d.appendChild(cv);
  const m = document.createElement('div');
  m.className = 'meta';
  const line = (k, v, other, col) => {
    if (!v) return '';
    const better = other ? (v.gate > other.gate ? 'win'
                          : v.gate < other.gate ? 'lose' : '') : '';
    return `<div class="row"><span class="k" style="color:${col}">${k}</span>`
      + `<span class="${better}">담음 ${v.cont}% · 게이트 ${v.gate}%`
      + ` · 면적비 ${v.ar}</span></div>`;
  };
  m.innerHTML = `<div class="row"><span class="k cells">${it.cells}칸</span>`
    + `<span style="color:#666">${it.id.split('/').pop().slice(0, 22)}</span></div>`
    + line('A', it.a, it.b, COL.a) + line('B', it.b, it.a, COL.b);
  d.appendChild(m);
  paint(cv, it);
  return d;
}

async function paint(cv, it) {
  const meta = await (await fetch(
    `/api/image?id=${encodeURIComponent(it.id)}&w=1200`)).json();
  if (meta.error) return;
  const img = new Image();
  await new Promise(res => { img.onload = res; img.src = meta.url; });
  const s = img.width / meta.ow;          // 표시본 배율 — 모든 상자에 같은 값
  let x0, y0, x1, y1;
  if ($('frame').value === 'full') {
    x0 = 0; y0 = 0; x1 = img.width; y1 = img.height;
  } else {
    const all = [it.gt].concat(it.a && it.a.deploy ? [it.a.deploy] : [])
                       .concat(it.b && it.b.deploy ? [it.b.deploy] : []);
    x0 = Math.min(...all.map(b => b[0])); y0 = Math.min(...all.map(b => b[1]));
    x1 = Math.max(...all.map(b => b[2])); y1 = Math.max(...all.map(b => b[3]));
    const px = (x1 - x0) * 0.2, py = (y1 - y0) * 0.2;
    x0 = Math.max(0, (x0 - px) * s); y0 = Math.max(0, (y0 - py) * s);
    x1 = Math.min(img.width, (x1 + px) * s);
    y1 = Math.min(img.height, (y1 + py) * s);
  }
  const w = Math.max(8, x1 - x0), h = Math.max(8, y1 - y0);
  cv.width = 660; cv.height = Math.round(660 * h / w);
  const k = cv.width / w, cx = cv.getContext('2d');
  cx.drawImage(img, x0, y0, w, h, 0, 0, cv.width, cv.height);
  if ($('frame').value === 'full') {
    cx.save(); cx.setLineDash([6, 6]); cx.strokeStyle = '#ffffff44';
    cx.lineWidth = 1.5; cx.beginPath();
    cx.moveTo(cv.width / 2, 0); cx.lineTo(cv.width / 2, cv.height);
    cx.moveTo(0, cv.height / 2); cx.lineTo(cv.width, cv.height / 2);
    cx.stroke(); cx.restore();
  }
  const box = (b, col, lw, dash) => {
    if (!b) return;
    cx.save();
    if (dash) cx.setLineDash(dash);
    cx.lineWidth = lw; cx.strokeStyle = col;
    cx.strokeRect(b[0]*s*k - x0*k, b[1]*s*k - y0*k,
                  (b[2]-b[0])*s*k, (b[3]-b[1])*s*k);
    cx.restore();
  };
  box(it.gt, COL.gt, 2);
  box(it.digit, COL.digit, 2);
  if (it.a) box(it.a.deploy, COL.a, 3);
  if (it.b) box(it.b.deploy, COL.b, 3, [7, 5]);   // B 는 점선 — 겹쳐도 갈린다
}

$('go').onclick = load;
for (const id of ['a', 'b', 'only', 'frame', 'split'])
  $(id).onchange = () => { if ($('a').value) load(); };
init();
</script>
