<!doctype html>
<meta charset="utf-8">
<title>실촬 검수 — 라이브 팔 비교</title>
<!--
  사람 지시(2026-09-21): "매번 요청할때마다 새로 추론하게 하면 안되냐" +
  "bandreal livecmp 하나로 합쳐라" + "정리해". 세 모드가 한 화면에 있다:
    단장 비교 — 사진 한 장을 A·B 가 방금 추론한 상자로 겹쳐/나란히 본다.
    실패 목록 — 코퍼스 전량을 라이브로 스캔해 실패 유형별로 묶는다
               (/bandreal 흡수. 배치 _diag 를 읽지 않는다).
    집약     — 팔 단위 4시드 배치 비교, 게이트 갈림 장 필터
               (/arms 흡수. 시드 잡음까지 보려면 배치가 필요해 라이브 대체
               불가다. 같은 질문의 세 번째 뷰가 아니라 같은 화면의 모드다).
  /bandreal · /arms 는 이 화면으로 흡수됐다(302 로 들어온다).

  지키는 것(/arms 에서 온 규칙):
  1. **두 자를 함께 낸다** — 담음과 게이트. 눈으로 보는 상자 옆에 숫자가 있다.
  2. **전체 사진 틀을 고를 수 있다** — 상자 주변만 잘라 보면 "사진의 어디냐"에
     답이 미리 정해진다(Case 9). 목록 카드도 전체 사진이다.
  3. **미검출도 보여 준다** — conf 0.25 밑은 미검출. 교환의 한쪽이다.
-->
<style>
  :root { --bg:#111; --fg:#ddd; --line:#333; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.55 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:9; background:#1a1a1a;
           border-bottom:1px solid var(--line); padding:9px 14px;
           display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select, button { background:#242424; color:var(--fg); border:1px solid #444;
           padding:4px 9px; border-radius:4px; font:inherit; cursor:pointer; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; }
  .legend i { display:inline-block; width:11px; height:11px; margin-right:4px;
              vertical-align:-1px; border-radius:2px; }
  .note { padding:9px 14px; color:#aaa; font-size:12px; background:#151515;
          border-bottom:1px solid var(--line); }
  #wrap { padding:14px; }
  #panels { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .panel { background:#1a1a1a; border:1px solid #2c2c2c; border-radius:6px;
           padding:8px; }
  .panel canvas { display:block; background:#000; border-radius:3px; }
  .pmeta { font-size:12px; padding-top:6px; line-height:1.7;
           font-variant-numeric:tabular-nums; }
  #info { font-size:12px; color:#9ad; padding-bottom:10px;
          font-variant-numeric:tabular-nums; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
          gap:10px; }
  .card { background:#1a1a1a; border:1px solid #2c2c2c; border-radius:6px;
          padding:6px; cursor:pointer; }
  .card:hover { border-color:#666; }
  .card canvas { width:100%; display:block; background:#000; border-radius:3px; }
  .cap { font-size:11px; color:#999; padding-top:4px; line-height:1.6;
         font-variant-numeric:tabular-nums; }
  .miss { color:#f87171; font-weight:600; }
  .win { color:#4ade80; } .lose { color:#f87171; }
  .cells { color:#fde68a; }
  .off { color:#f87171; } .part { color:#fc6; }
</style>

<header>
  <b><a href="/" style="color:var(--fg);text-decoration:none">실촬 검수</a></b>
  <label>모드 <select id="mode">
    <option value="one" selected>단장 비교</option>
    <option value="list">실패 목록 (전량 스캔)</option>
    <option value="agg">집약 (4시드 배치)</option>
  </select></label>
  <label>A <select id="a"></select></label>
  <label>B <select id="b"></select></label>
  <label>코퍼스 <select id="corpus"></select></label>
  <span id="oneCtl">
    <label>순서 <select id="order">
      <option value="small" selected>작은 밴드부터</option>
      <option value="big">큰 밴드부터</option>
      <option value="rand">무작위</option>
      <option value="name">이름순</option>
    </select></label>
    <label>보기 <select id="view">
      <option value="stack" selected>겹침(한 판)</option>
      <option value="side">나란히(두 판)</option>
    </select></label>
    <button id="prev">◀</button>
    <span id="pos">–</span>
    <button id="next">▶</button>
    <button id="rand">🎲</button>
  </span>
  <span id="listCtl" style="display:none">
    <label>대상 <select id="ftgt">
      <option value="a" selected>A</option>
      <option value="b">B</option>
      <option value="diff">갈림(A≠B)</option>
    </select></label>
    <label>유형 <select id="fcls">
      <option value="gate_fail" selected>게이트 탈락(담았는데 큼)</option>
      <option value="딴 데">딴 데</option>
      <option value="일부만">일부만 담음</option>
      <option value="미검출">미검출</option>
      <option value="fail">실패 전부</option>
      <option value="all">전부</option>
    </select></label>
  </span>
  <span id="aggCtl" style="display:none">
    <label>보기 <select id="aggonly">
      <option value="gate_diff" selected>게이트가 갈린 장</option>
      <option value="b_better">B 가 이긴 장</option>
      <option value="a_better">A 가 이긴 장</option>
      <option value="both_fail">둘 다 못 담은 장</option>
      <option value="all">전부</option>
    </select></label>
  </span>
  <label>틀 <select id="frame">
    <option value="crop" selected>상자 주변</option>
    <option value="full">전체 사진</option>
  </select></label>
  <div class="legend">
    <span><i style="background:#22c55e"></i>사람 라벨</span>
    <span><i style="background:#ef4444"></i>숫자 칸</span>
    <span><i style="background:#eab308"></i><b>A</b> 배포 상자</span>
    <span><i style="background:#38bdf8"></i><b>B</b> 배포 상자(점선)</span>
  </div>
</header>
<div class="note">
  <b>요청 때마다 추론한다</b> — 단장·목록은 방금 고른 체크포인트가 낸 상자다
  (목록은 처음에 전량 스캔 후 캐시). 집약만 팔 단위 4시드 배치(_diag)를
  읽는다 — 시드 잡음은 배치로만 잰다. conf &lt; 0.25 는
  <span class="miss">미검출</span>. 키보드 ◀▶·R(단장 모드). 카드를 누르면
  단장 모드로 파고든다.
</div>
<div id="wrap">
  <div id="info"></div>
  <div id="body"><div class="pmeta">체크포인트를 고른다…</div></div>
</div>

<script>
const $ = i => document.getElementById(i);
const COL = {gt:'#22c55e', digit:'#ef4444', a:'#eab308', b:'#38bdf8'};
const CLSCOL = {'통과': 'win', '딴 데': 'off', '일부만': 'part', '미검출': 'miss'};
let CK = [], ARMS = [], IDS = [], pos = -1, CUR = null, SCAN = null, pollT = null;
const RNG = Math.random;
const MARK = {keep: '채택', reject: '기각', super: '대체됨', evidence: '증거',
              aside: '사슬 밖', '미등록': '미등록'};

async function init() {
  const r = await (await fetch('/api/livecmp')).json();
  CK = r.ckpts || [];
  ARMS = (await (await fetch('/api/arms')).json()).arms || [];
  const label = x => `${x.stage != null ? x.stage + '회 ' : ''}${x.arm}`
    + (x.seed != null ? ' s' + x.seed : '')
    + ` — ${x.what || '(설명 없음)'} [${MARK[x.verdict] || x.verdict}]`;
  for (const sel of [$('a'), $('b')])
    sel.innerHTML = CK.map(x =>
      `<option value="${x.rel}">${label(x)}</option>`).join('');
  const pickArm = (sel, name) => {
    const cands = CK.filter(x => x.arm === name && x.seed === 0);
    const o = [...sel.options].find(o => o.value ===
      (cands[0] || CK.find(x => x.arm === name) || {}).rel);
    if (o) sel.value = o.value;
  };
  const p = r.pick || {};
  pickArm($('a'), p.A || 'asize512'); pickArm($('b'), p.B || 'abig');
  $('corpus').innerHTML = (r.corpora || [])
    .map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');
  await loadList();
  if (IDS.length) { pos = 0; show(); }
}

async function loadList() {
  const q = new URLSearchParams({list: 1, corpus: $('corpus').value});
  const r = await (await fetch('/api/livecmp?' + q)).json();
  IDS = r.ids || [];
  resort();
}

function resort() {
  const o = $('order').value;
  if (o === 'small') IDS.sort((x, y) => x.cells - y.cells || (x.id < y.id ? -1 : 1));
  if (o === 'big')   IDS.sort((x, y) => y.cells - x.cells || (x.id < y.id ? -1 : 1));
  if (o === 'name')  IDS.sort((x, y) => x.id < y.id ? -1 : 1);
  if (o === 'rand')  IDS.sort(() => RNG() - 0.5);
  pos = Math.min(pos < 0 ? 0 : pos, IDS.length - 1);
}

async function show() {
  if (!IDS.length || pos < 0) return;
  const id = IDS[pos].id;
  $('pos').textContent = `${pos + 1}/${IDS.length}`;
  const q = new URLSearchParams({a: $('a').value, b: $('b').value,
    corpus: $('corpus').value, id});
  CUR = await (await fetch('/api/livecmp?' + q)).json();
  if (CUR.error) { $('info').textContent = CUR.error; return; }
  renderOne();
}

function line(k, m, other) {
  const nm = (CK.find(x => x.rel === $(k).value) || {}).arm || k;
  let body;
  if (!m) body = '(선택 안 함)';
  else if (m.error) body = m.error;
  else if (!m.det) body = `<span class="miss">미검출</span> (score ${m.score})`;
  else {
    const w = other && other.det
      ? (m.gate && !other.gate ? 'win' : !m.gate && other.gate ? 'lose' : '')
      : (m.gate ? 'win' : '');
    body = `score ${m.score} · 담음 ${m.contain ? 'O' : 'X'} · `
      + `게이트 <span class="${w}">${m.gate ? 'O' : 'X'}</span> · 면적비 ${m.ar}`;
  }
  return `<div style="color:${COL[k]}"><b>${k.toUpperCase()}</b> ${nm}: ${body}</div>`;
}

function renderOne() {
  const P = $('body');
  P.innerHTML = '';
  const cells = CUR.cells != null
    ? `<span class="cells">${CUR.cells}칸</span> · ` : '';
  $('info').innerHTML = `${cells}${CUR.id} — 방금 추론`;
  renderOneInto(P);
}

async function loadImg(url, onFail) {
  const img = new Image();
  await new Promise(res => {
    img.onload = res;
    img.onerror = () => { img._fail = true; res(); };   // 검은 캔버스로 못 내게
    img.src = url;
  });
  if (img._fail && onFail) onFail();
  return img;
}

async function renderOneInto(P) {
  const meta = await (await fetch(
    `/api/image?id=${encodeURIComponent(CUR.id)}&w=1200`)).json();
  if (meta.error) { P.textContent = meta.error; return; }
  const img = await loadImg(meta.url,
                            () => { P.textContent = '이미지 로드 실패: ' + meta.url; });
  if (img._fail) return;
  const s = img.width / meta.ow;              // 표시본 배율 — 모든 상자에 동일

  const mk = withBox => {
    const d = document.createElement('div');
    d.className = 'panel';
    const cv = document.createElement('canvas');
    d.appendChild(cv);
    const m = document.createElement('div');
    m.className = 'pmeta';
    m.innerHTML = withBox === 'a' ? line('a', CUR.a, CUR.b)
                  : withBox === 'b' ? line('b', CUR.b, CUR.a)
                  : line('a', CUR.a, CUR.b) + line('b', CUR.b, CUR.a);
    d.appendChild(m);
    paintCrop(cv, img, s, meta, withBox);
    return d;
  };
  const wrap = document.createElement('div');
  wrap.id = 'panels';
  if ($('view').value === 'side') { wrap.appendChild(mk('a')); wrap.appendChild(mk('b')); }
  else wrap.appendChild(mk('both'));
  P.appendChild(wrap);
}

async function paintCrop(cv, img, s, meta, withBox) {
  let x0, y0, x1, y1;
  if ($('frame').value === 'full' || !CUR.gt) {
    x0 = 0; y0 = 0; x1 = img.width; y1 = img.height;
  } else {
    const all = [CUR.gt];
    for (const k of ['a', 'b'])
      if (CUR[k] && CUR[k].deploy) all.push(CUR[k].deploy);
    x0 = Math.min(...all.map(b => b[0])); y0 = Math.min(...all.map(b => b[1]));
    x1 = Math.max(...all.map(b => b[2])); y1 = Math.max(...all.map(b => b[3]));
    const px = (x1 - x0) * 0.2, py = (y1 - y0) * 0.2;
    x0 = Math.max(0, (x0 - px) * s); y0 = Math.max(0, (y0 - py) * s);
    x1 = Math.min(img.width, (x1 + px) * s);
    y1 = Math.min(img.height, (y1 + py) * s);
  }
  const w = Math.max(8, x1 - x0), h = Math.max(8, y1 - y0);
  const CW = 620;
  cv.width = CW; cv.height = Math.round(CW * h / w);
  const k = CW / w, cx = cv.getContext('2d');
  cx.drawImage(img, x0, y0, w, h, 0, 0, CW, cv.height);
  const box = (b, col, lw, dash) => {
    if (!b) return;
    cx.save();
    if (dash) cx.setLineDash(dash);
    cx.lineWidth = lw; cx.strokeStyle = col;
    cx.strokeRect(b[0]*s*k - x0*k, b[1]*s*k - y0*k,
                  (b[2]-b[0])*s*k, (b[3]-b[1])*s*k);
    cx.restore();
  };
  box(CUR.gt, COL.gt, 2);
  box(CUR.digit, COL.digit, 1.5, [4, 4]);
  if (withBox !== 'b' && CUR.a && CUR.a.deploy) box(CUR.a.deploy, COL.a, 3);
  if (withBox !== 'a' && CUR.b && CUR.b.deploy) box(CUR.b.deploy, COL.b, 3, [7, 5]);
}

// ── 실패 목록 모드 — 전량 라이브 스캔 (/bandreal 흡수) ────────────────────
async function scan() {
  const q = new URLSearchParams({scan: 1, a: $('a').value, b: $('b').value,
                                 corpus: $('corpus').value});
  for (;;) {
    const r = await (await fetch('/api/livecmp?' + q)).json();
    if (r.error) { $('info').textContent = r.error; return null; }
    if (r.done) { SCAN = r.rows; return SCAN; }
    $('info').textContent =
      `전량 스캔 중… ${r.progress}/${r.n_total} — 첫 스캔 후 캐시`;
    await new Promise(res => pollT = setTimeout(res, 1000));
  }
}

function summary(rows) {
  const cnt = m => { const c = {}; for (const k of ['통과','일부만','딴 데','미검출'])
    c[k] = rows.filter(r => r[m] && r[m].cls === k).length;
    c.게이트 = rows.filter(r => r[m] && r[m].gate).length; return c; };
  const fmt = (m, nm) => {
    if (!$(m).value) return '';
    const c = cnt(m);
    return `<span style="color:${COL[m]}"><b>${nm}</b> `
      + `게이트 ${Math.round(100*c.게이트/rows.length)}% `
      + `(${c['통과']}/${c['일부만']}/${c['딴 데']}/${c['미검출']})</span>`;
  };
  return `n=${rows.length} · 통과/일부만/딴데/미검출 · `
    + fmt('a', 'A') + ' · ' + fmt('b', 'B');
}

function pick(row) {
  const t = $('ftgt').value, f = $('fcls').value;
  const clsOf = m => (row[m] && row[m].cls) || null;
  if (t === 'diff') {
    if (clsOf('a') === clsOf('b')) return false;
  } else if (!clsOf(t)) return false;
  if (f === 'all') return true;
  if (f === 'fail') {
    const m = t === 'diff' ? ['a','b'] : [t];
    return m.some(k => clsOf(k) && clsOf(k) !== '통과');
  }
  if (f === 'gate_fail') {
    const m = t === 'diff' ? ['a','b'] : [t];
    return m.some(k => row[k] && row[k].contain && !row[k].gate);
  }
  const m = t === 'diff' ? ['a','b'] : [t];
  return m.some(k => clsOf(k) === f);
}

async function renderList() {
  const P = $('body');
  P.innerHTML = '';
  const rows = await scan();
  if (!rows) return;
  const sel = rows.filter(pick);
  sel.sort((x, y) => x.cells - y.cells || (x.id < y.id ? -1 : 1));
  $('info').innerHTML = summary(rows) + ` · 표시 ${sel.length}장 — 칸수순`;
  const g = document.createElement('div');
  g.id = 'grid';
  P.appendChild(g);
  for (const row of sel) g.appendChild(await card(row));
}

async function card(row) {
  const d = document.createElement('div');
  d.className = 'card';
  d.onclick = () => {                 // 카드를 누르면 단장 모드로 파고든다
    const idx = IDS.findIndex(x => x.id === row.id);
    if (idx >= 0) { pos = idx; $('mode').value = 'one'; switchMode(); show(); }
  };
  const cv = document.createElement('canvas');
  d.appendChild(cv);
  const cap = document.createElement('div');
  cap.className = 'cap';
  const seg = k => {
    if (!$('b').value && k === 'b') return '';
    const m = row[k];
    if (!m) return '';
    if (!m.det) return ` <span style="color:${COL[k]}"><b>${k.toUpperCase()}</b>`
      + ` <span class="miss">미검출</span></span>`;
    return ` <span style="color:${COL[k]}"><b>${k.toUpperCase()}</b>`
      + ` <span class="${CLSCOL[m.cls] || ''}">${m.cls}</span> ${m.ar}</span>`;
  };
  cap.innerHTML = `<span class="cells">${row.cells}칸</span> `
    + row.id.split('/').pop().slice(0, 26) + seg('a') + seg('b');
  d.appendChild(cap);
  const meta = await (await fetch(
    `/api/image?id=${encodeURIComponent(row.id)}&w=640`)).json();
  if (meta.error) { cap.textContent = meta.error; return d; }
  const img = await loadImg(meta.url, () => { cap.textContent = '이미지 로드 실패'; });
  if (img._fail) return d;
  const s = img.width / meta.ow;
  const CW = 300;
  cv.width = CW; cv.height = Math.round(CW * img.height / img.width);
  const cx = cv.getContext('2d');
  const k = CW / img.width;
  cx.drawImage(img, 0, 0, CW, cv.height);
  const box = (b, col, lw, dash) => {
    if (!b) return;
    cx.save();
    if (dash) cx.setLineDash(dash);
    cx.lineWidth = lw; cx.strokeStyle = col;
    cx.strokeRect(b[0]*s*k, b[1]*s*k, (b[2]-b[0])*s*k, (b[3]-b[1])*s*k);
    cx.restore();
  };
  box(row.gt, COL.gt, 1.5);
  if (row.a && row.a.deploy) box(row.a.deploy, COL.a, 2);
  if (row.b && row.b.deploy) box(row.b.deploy, COL.b, 2, [5, 4]);
  return d;
}

// ── 집약 모드 — 팔 단위 4시드 배치 비교 (/arms 흡수) ──────────────────────
// 단장·목록이 시드 하나를 방금 추론한다면, 여기는 시드 4개를 합친 배치
// 평가를 읽는다(_diag). 시드 잡음까지 재는 데는 배치가 필요해 라이브로
// 대체할 수 없다 — 그래서 흡수는 했지만 모드로 산다.
function armOf(sel) {
  const rel = $(sel).value;
  const arm = (CK.find(x => x.rel === rel) || {}).arm;
  const ent = ARMS.find(x => x.arm === arm) || {};
  return {arm, spec: ent.dir ? `${arm}@${ent.dir}` : ''};
}

async function renderAgg() {
  const P = $('body');
  P.innerHTML = '';
  const split = {rfdev: 'dev', rftest: 'test'}[$('corpus').value];
  if (!split) {
    $('info').textContent = '집약은 Roboflow 표본(dev·test)에서만 된다 — 코퍼스를 바꿔라';
    return;
  }
  const A = armOf('a'), B = armOf('b');
  if (!A.spec) { $('info').textContent = `A(${A.arm}) 에 배치 결과가 없다`; return; }
  if (!B.spec) { $('info').textContent = `B(${B.arm}) 에 배치 결과가 없다`; return; }
  const q = new URLSearchParams({a: A.spec, b: B.spec,
    only: $('aggonly').value, split});
  const r = await (await fetch('/api/arms?' + q)).json();
  if (r.error) { $('info').textContent = r.error; return; }
  const s = r.summary;
  $('info').innerHTML = `팔 집약(4시드) — 표시 ${r.shown}/${r.matched}장 · 전체 ${s.n} · `
    + `A 담음 ${s.a_cont}% 게이트 <b>${s.a_gate}%</b>`
    + (s.b_gate !== undefined
       ? ` · B 담음 ${s.b_cont}% 게이트 <b>${s.b_gate}%</b>` : '');
  const g = document.createElement('div');
  g.id = 'grid';
  P.appendChild(g);
  for (const it of r.items) g.appendChild(await aggCard(it, split));
}

async function aggCard(it, split) {
  const d = document.createElement('div');
  d.className = 'card';
  d.onclick = async () => {          // 카드 → 단장 모드로 파고든다(라이브 추론)
    $('corpus').value = split === 'dev' ? 'rfdev' : 'rftest';
    pos = 0; await loadList();
    const idx = IDS.findIndex(x => x.id === it.id);
    if (idx >= 0) { pos = idx; $('mode').value = 'one'; switchMode(); show(); }
  };
  const cv = document.createElement('canvas');
  d.appendChild(cv);
  const cap = document.createElement('div');
  cap.className = 'cap';
  const seg = (k, m, other) => {
    if (!m) return '';
    const w = other ? (m.gate > other.gate ? 'win' : m.gate < other.gate
                      ? 'lose' : '') : '';
    return ` <span style="color:${COL[k]}"><b>${k.toUpperCase()}</b>`
      + ` <span class="${w}">${m.gate}%</span>·${m.ar}</span>`;
  };
  cap.innerHTML = `<span class="cells">${it.cells}칸</span> `
    + it.id.split('/').pop().slice(0, 26) + seg('a', it.a, it.b) + seg('b', it.b, it.a);
  d.appendChild(cap);
  const meta = await (await fetch(
    `/api/image?id=${encodeURIComponent(it.id)}&w=640`)).json();
  if (meta.error) { cap.textContent = meta.error; return d; }
  const img = await loadImg(meta.url,
                            () => { cap.textContent = '이미지 로드 실패'; });
  if (img._fail) return d;
  const s = img.width / meta.ow;
  const CW = 300;
  cv.width = CW; cv.height = Math.round(CW * img.height / img.width);
  const cx = cv.getContext('2d');
  const k = CW / img.width;
  cx.drawImage(img, 0, 0, CW, cv.height);
  const box = (b, col, lw, dash) => {
    if (!b) return;
    cx.save();
    if (dash) cx.setLineDash(dash);
    cx.lineWidth = lw; cx.strokeStyle = col;
    cx.strokeRect(b[0]*s*k, b[1]*s*k, (b[2]-b[0])*s*k, (b[3]-b[1])*s*k);
    cx.restore();
  };
  box(it.gt, COL.gt, 1.5);
  if (it.a && it.a.deploy) box(it.a.deploy, COL.a, 2);
  if (it.b && it.b.deploy) box(it.b.deploy, COL.b, 2, [5, 4]);
  return d;
}

function switchMode() {
  const one = $('mode').value === 'one';
  const agg = $('mode').value === 'agg';
  $('oneCtl').style.display = one ? '' : 'none';
  $('listCtl').style.display = $('mode').value === 'list' ? '' : 'none';
  $('aggCtl').style.display = agg ? '' : 'none';
  if (pollT) { clearTimeout(pollT); pollT = null; }
  if (one) { if (CUR) renderOne(); else if (IDS.length) show(); }
  else if (agg) renderAgg();
  else renderList();
}

$('mode').onchange = switchMode;
$('prev').onclick = () => { if (pos > 0) { pos--; show(); } };
$('next').onclick = () => { if (pos < IDS.length - 1) { pos++; show(); } };
$('rand').onclick = () => { pos = Math.floor(RNG() * IDS.length); show(); };
// **A·B 를 바꾸면 다시 추론한다.** 구판은 캐시를 다시 그리기만 해서
// 상자가 안 움직였다(2026-09-21 사람 보고). 프레임·보기만 다시 그린다.
for (const id of ['a', 'b'])
  $(id).onchange = () => {
    if ($('mode').value === 'one') { if (CUR) show(); }
    else if ($('mode').value === 'agg') renderAgg();
    else renderList();
  };
for (const id of ['frame', 'view'])
  $(id).onchange = () => {
    if ($('mode').value === 'one') { if (CUR) renderOne(); }
    else if ($('mode').value === 'agg') renderAgg();
  };
$('corpus').onchange = async () => {
  pos = 0; await loadList();
  if ($('mode').value === 'one') show();
  else if ($('mode').value === 'agg') renderAgg();
  else renderList();
};
$('order').onchange = () => { resort(); pos = 0; show(); };
for (const id of ['ftgt', 'fcls'])
  $(id).onchange = () => { if (SCAN) renderList(); };
$('aggonly').onchange = () => { if ($('mode').value === 'agg') renderAgg(); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if ($('mode').value !== 'one') return;
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 'r' || e.key === 'R') $('rand').click();
});
init();
</script>
