<!doctype html>
<meta charset="utf-8">
<title>학습 증강 열람 — 모델이 실제로 보는 것</title>
<!--
  사람 요청(2026-09-20): "훈련에사용된 데이터 증강물을 웹툴에서 확인하게해줘".

  서버가 train_band.CocoBand 를 **그대로 호출**해서 준다. 여기서 따로 그리지
  않는다 — 재구현하면 학습이 보는 것과 다른 것을 보게 되고 그 차이는 눈으로
  못 잡는다.

  보이는 것은 **레터박스 416 입력 그대로**다(PAD=114 회색 띠 포함). 모델이
  받는 바로 그 텐서를 이미지로 되돌린 것이고, 초록 상자도 그 좌표계의 정답이다.

  같은 장을 왼쪽 원본 / 오른쪽 증강으로 놓는다. 증강은 방문마다 다르게
  뽑히므로(2026-09-19 감사에서 고친 부분) 같은 장을 여러 번 뽑아 볼 수 있다.
-->
<style>
  body { margin:0; background:#111; color:#ddd; font:13px/1.5 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:#1a1a1a; padding:10px 14px;
           border-bottom:1px solid #333; display:flex; gap:14px; align-items:center;
           flex-wrap:wrap; }
  select, button { background:#222; color:#ddd; border:1px solid #444; padding:4px 9px;
           border-radius:4px; font:inherit; cursor:pointer; }
  .sum { color:#9ad; }
  .warn { color:#fc6; }
  #grid { display:grid; gap:14px; padding:14px; }
  .row { background:#1a1a1a; border:1px solid #2c2c2c; border-radius:6px; padding:8px; }
  .strip { display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap; }
  .cell { text-align:center; }
  .cell img { display:block; width:260px; image-rendering:pixelated;
              border:1px solid #333; background:#000; }
  .cap { font-size:11px; color:#888; padding-top:3px; }
  .cap b { color:#9d8; }
  .nm { font-size:12px; color:#aaa; padding-bottom:5px; }
</style>

<header>
  <b>학습 증강 열람</b>
  <label>장수 <select id="n">
    <option>4</option><option selected>6</option><option>10</option>
  </select></label>
  <label>증강 뽑기 <select id="draws">
    <option>1</option><option selected>3</option><option>4</option>
  </select></label>
  <button id="prev">◀ 이전</button>
  <button id="next">다음 ▶</button>
  <button id="rand">무작위</button>
  <span id="sum" class="sum"></span>
</header>
<div id="grid">불러오는 중… (첫 호출은 torch 적재로 몇 초 걸린다)</div>

<script>
const $ = id => document.getElementById(id);
let START = 0, TOTAL = 0;

async function load() {
  $('grid').textContent = '불러오는 중…';
  const n = $('n').value, d = $('draws').value;
  const r = await (await fetch(`/api/aug?n=${n}&start=${START}&draws=${d}`)).json();
  if (r.error) { $('grid').innerHTML = `<span class="warn">${r.error}</span>`; return; }
  TOTAL = r.n;
  $('sum').innerHTML = `TB 학습 장 ${TOTAL.toLocaleString()} 중 ${r.start} 부터`
    + ` · <b>레터박스 416 입력 그대로</b> · 초록 = 정답 상자`;
  $('grid').innerHTML = r.rows.map(row => `
    <div class="row">
      <div class="nm">#${row.i} &nbsp; ${row.name}</div>
      <div class="strip">
        <div class="cell">
          <img src="${row.plain.png}">
          <div class="cap"><b>원본</b> (증강 끔)</div>
        </div>
        ${row.aug.map((a, k) => `
        <div class="cell">
          <img src="${a.png}">
          <div class="cap">증강 뽑기 ${k + 1}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

$('prev').onclick = () => { START = Math.max(0, START - parseInt($('n').value, 10)); load(); };
$('next').onclick = () => { START += parseInt($('n').value, 10); load(); };
$('rand').onclick = () => { START = Math.floor(Math.random() * Math.max(1, TOTAL)); load(); };
$('n').onchange = load;
$('draws').onchange = load;
load();
</script>
